[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantom-audio"
version = "1.3.1"
description = "AI audio engineering system -- makes Claude a professional audio engineer"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Phantom Contributors" },
]
keywords = [
    "audio", "mixing", "mastering", "audio-engineering", "mcp",
    "claude", "ai", "analysis", "loudness", "spectral",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.13.0",
    "pydantic>=2.0",
    "essentia==2.1b6.dev1389",
    "scipy>=1.12",
    "fastmcp>=3.2",
    "click>=8.0",
    "rich>=13.0",
    "rich-click>=1.8",
    "plotext>=5.3",
    "ffmpeg-progress-yield>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.4",
    "pyloudnorm>=0.1.0",
    "hypothesis>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "ruff>=0.15",
    "pre-commit>=4.0",
]
analysis = [
    "librosa>=0.11.0",
]
# Backward-compatible meta-installer: the Demucs/PyTorch implementation now
# lives in the sibling distribution phantom-audio-separation (issue #7).
separation = [
    "phantom-audio-separation",
]
matching = [
    "matchering>=2.0",
]
processing = [
    "pedalboard>=0.9",
]
all = [
    "phantom-audio[analysis,separation,matching,processing]",
]

[project.urls]
Homepage = "https://github.com/fadelabs/phantom"
Documentation = "https://github.com/fadelabs/phantom#readme"
Repository = "https://github.com/fadelabs/phantom"
Issues = "https://github.com/fadelabs/phantom/issues"
Changelog = "https://github.com/fadelabs/phantom/releases"

[project.scripts]
phantom = "phantom.cli:cli"
phantom-mcp = "phantom.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phantom"]
artifacts = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires real audio in tests/fixtures/live/",
    "slow: long-running tests (60s+ audio fixtures)",
]
filterwarnings = [
    "ignore:authlib.jose module is deprecated:authlib.deprecate.AuthlibDeprecationWarning",
    "ignore::DeprecationWarning:matchering.*",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "B",   # bugbear
    "C90", # complexity gate (mccabe)
    "I",   # import sorting (isort)
]
# Curated baseline (code review 2026-08, D.2): these codes currently fire
# across src/, tests/, and packages/ and are tolerated while the debt is
# cleared. Remove a code here once its findings are fixed; new code must
# satisfy every other rule in the selected families from the start.
extend-ignore = [
    "B007",  # unused loop control variable (7x)
    "B017",  # blind `assert Exception` (1x)
    "B028",  # logging call without explicit stacklevel (1x)
    "B904",  # raise inside except without `from` (13x)
    "B905",  # zip without strict= (7x)
    "I001",  # unsorted imports (97x) -- run `ruff check --fix --select I001`
]

[tool.ruff.lint.per-file-ignores]
# Complexity gate stays live everywhere else; these are the known-complex
# CLI / comparison files scheduled for the Phase-2 facade.
"src/phantom/cli/__init__.py" = ["C901"]
"src/phantom/cli/compare.py" = ["C901"]
"src/phantom/cli/doctor.py" = ["C901"]
"src/phantom/cli/fix.py" = ["C901"]
"src/phantom/cli/render.py" = ["C901"]
"src/phantom/cli/setup.py" = ["C901"]
"src/phantom/cli/setup_reaper.py" = ["C901"]
"src/phantom/cli/uninstall.py" = ["C901"]
"src/phantom/comparison.py" = ["C901"]
"src/phantom/_profiles.py" = ["C901"]
"src/phantom/_utils.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["phantom"]

[tool.mypy]
python_version = "3.10"
# Third-party analysis deps (essentia, soundfile, fastmcp) ship without
# stubs; matching CONTRIBUTING which waived typing on those grounds.
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "midiutil>=1.2.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
phantom-audio-separation = { workspace = true }
