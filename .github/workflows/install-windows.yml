name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - install.ps1
      - tests/install_ps1/**
      - .github/workflows/install-windows.yml
  pull_request:
    branches: [main]
    paths:
      - install.ps1
      - tests/install_ps1/**
      - .github/workflows/install-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry:
    name: Telemetry payload (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # What users actually run: the PowerShell that ships with Windows.
          - label: Windows PowerShell 5.1
            pwsh: powershell
          - label: PowerShell 7
            pwsh: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The interpreter is chosen inside `run` rather than via `shell`, because
      # `shell` is not an expression-enabled key and a matrix reference there
      # makes the whole workflow fail to load.
      - name: Report PowerShell version
        run: ${{ matrix.pwsh }} -NoProfile -Command '$PSVersionTable | Format-List'

      - name: Parse check
        run: ${{ matrix.pwsh }} -NoProfile -File tests/install_ps1/parse_check.ps1

      - name: Verify telemetry payload
        env:
          PWSH: ${{ matrix.pwsh }}
        run: python tests/install_ps1/verify_telemetry.py

  # An `end-to-end` job ran install.ps1 for real on windows-latest here. It
  # could only ever fail: essentia publishes no win_amd64 wheel, so
  # `uv tool install phantom-audio` does not resolve on Windows at all, and the
  # job was marked continue-on-error for that reason. A permanently red job in
  # an otherwise green run is noise -- it trains you to ignore the colour, and
  # it says nothing new that issue #52 does not already record.
  #
  # Restore it as part of #52 step 6, which calls for flipping this job to
  # blocking once the dependency gap closes. Everything it needs is still in
  # the tree: tests/install_ps1/run_installer.ps1 is used by nothing else and
  # is kept for exactly that. The removed job checked out the repo, ran
  # run_installer.ps1 in a child process under Windows PowerShell with
  # PHANTOM_NO_TELEMETRY=1 so synthetic installs stayed out of production
  # analytics, propagated the installer's exit code, then verified `phantom`
  # resolved on PATH and ran `phantom --version` and `phantom doctor`.
  #
  # The telemetry job above is unaffected and still covers install.ps1 on both
  # Windows PowerShell 5.1 and PowerShell 7.
