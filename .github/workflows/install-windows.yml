name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - install.ps1
      - tests/install_ps1/**
      - .github/workflows/install-windows.yml
  pull_request:
    branches: [main]
    paths:
      - install.ps1
      - tests/install_ps1/**
      - .github/workflows/install-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry:
    name: Telemetry payload (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # What users actually run: the PowerShell that ships with Windows.
          - label: Windows PowerShell 5.1
            pwsh: powershell
          - label: PowerShell 7
            pwsh: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Report PowerShell version
        shell: ${{ matrix.pwsh }}
        run: $PSVersionTable | Format-List

      - name: Parse check
        shell: ${{ matrix.pwsh }}
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object {
              Write-Host "PARSE ERROR line $($_.Extent.StartLineNumber): $($_.Message)"
            }
            exit 1
          }
          Write-Host "install.ps1 parses clean"

      - name: Verify telemetry payload
        env:
          PWSH: ${{ matrix.pwsh }}
        run: python tests/install_ps1/verify_telemetry.py

  end-to-end:
    name: Real install on Windows
    runs-on: windows-latest
    # Telemetry stays off: this job exercises the install mechanics, and a real
    # ping would put synthetic installs into production analytics. The payload
    # itself is covered by the telemetry job above.
    env:
      PHANTOM_NO_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v7

      # Runs the documented path (`irm ... | iex`) in a child process, so the
      # installer's own exit code is unambiguous. Invoking it inline would let a
      # stale $LASTEXITCODE from a command install.ps1 already handled fail the
      # step, and would not exercise Invoke-Expression's `exit` semantics.
      - name: Run install.ps1 the way users do
        shell: powershell
        run: |
          $p = Start-Process powershell -NoNewWindow -Wait -PassThru -ArgumentList `
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command',
            "Get-Content '$PWD\install.ps1' -Raw | Invoke-Expression"
          Write-Host "installer exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Verify phantom is installed and on PATH
        shell: powershell
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
                      [System.Environment]::GetEnvironmentVariable("Path", "User")
          $cmd = Get-Command phantom -ErrorAction Stop
          Write-Host "phantom resolved to $($cmd.Source)"
          phantom --version
          phantom doctor
