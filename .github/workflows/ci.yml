name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/ packages/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/ tests/ packages/

      - name: Test (pytest)
        run: uv run pytest tests/ -x -q --tb=short

  optional-deps:
    name: Optional dependencies
    runs-on: ubuntu-latest
    # No continue-on-error: this is the only job that installs the extras, so
    # it is the only place the pedalboard-backed processing surface runs at
    # all. Swallowing its result meant a break in the shipped extras could not
    # turn the check suite red.

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install with optional extras
        run: uv sync --locked --python 3.12 --extra dev --extra matching --extra separation --extra processing

      # The whole suite, not just test_optional_deps.py. tests/test_processing.py
      # is 41 tests behind @skipif(not _has_pedalboard); the main jobs install
      # only --extra dev, so they skip, and this job never selected the file --
      # the pedalboard-backed surface ran in no CI job at all. Running tests/
      # here also picks up anything else the extras unskip.
      - name: Test optional dependencies
        run: uv run pytest tests/ packages/phantom-audio-separation/tests -x -q --tb=short

  security:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit
